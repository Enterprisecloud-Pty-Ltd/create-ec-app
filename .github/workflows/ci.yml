name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-smoke:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version:
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Scaffold smoke
        run: npm run smoke:scaffold
