name: Generated Build

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  generated-build:
    runs-on: ubuntu-24.04
    env:
      PP_TOOLS_TELEMETRY_OPTOUT: "true"

    strategy:
      matrix:
        node-version: [22.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated projects
        run: npm run build:generated
