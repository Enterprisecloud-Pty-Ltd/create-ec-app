name: Generated Build

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  generated-build:
    runs-on: ubuntu-24.04
    env:
      PP_TOOLS_TELEMETRY_OPTOUT: "true"

    strategy:
      matrix:
        node-version: [22.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated projects
        run: npm run build:generated

  # The weekly run is the early warning that a published dependency, registry
  # change, or Microsoft tooling update broke the generated apps. Nobody watches
  # the Actions tab, so surface a failure as an issue instead.
  report-scheduled-failure:
    if: failure() && github.event_name == 'schedule'
    needs: generated-build
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Scheduled generated build failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly generated-build matrix failed: ${runUrl}`,
              "",
              "Check the failing Node version and target/UI combination in the run log.",
              "Start with `docs/tooling.md` and the `update-templates` skill; do not loosen lint rules or force peer resolution to make it pass.",
            ].join("\n");

            const label = "generated-build";
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "d73a4a",
                description: "Weekly generated-build matrix failed",
              });
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
