name: Generated Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  generated-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated projects
        run: npm run build:generated
